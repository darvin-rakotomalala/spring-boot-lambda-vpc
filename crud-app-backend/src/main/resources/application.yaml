spring:
  application:
    name: crud-app-backend

  # ── JPA / Hibernate ──────────────────────────────────────────────────
  jpa:
    properties:
      hibernate:
        # Note: You can remove dialect in Spring Boot 3+ / Hibernate 6+
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: 'true'
          batch_size: '50'
    hibernate:
      ddl-auto: 'update'

  main:
    lazy-initialization: 'true'

  # ── DataSource (credentials are fetched from Secrets Manager) ────────
  datasource:
    driver-class-name: com.amazonaws.secretsmanager.sql.AWSSecretsManagerPostgreSQLDriver
    url: jdbc-secretsmanager:postgresql://ce-dev-rds-proxy.proxy-conyo2aki51n.us-east-1.rds.amazonaws.com:5432/lambdaappdb
    # With the Secrets Manager driver this is the secret name, not a DB user.
    username: ce-dev/rds/backend-db-credentials
    hikari:
      # Negative value: create the pool without trying to connect.
      initialization-fail-timeout: -1
      # No idle connections held across the SnapStart snapshot or a freeze.
      minimum-idle: 0
      # A Lambda environment serves one request at a time.
      maximum-pool-size: 2
      # Keep below API Gateway's 29s limit so failures return cleanly.
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── Web ──────────────────────────────────────────────────────────────
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    throw-exception-if-no-handler-found: true

cors:
  allowed:
    origins: '*'

application:
  description: '@project.description@'
  name: '@project.artifactId@'

build:
  timestamp: '@maven.build.timestamp@'
  version: '@project.version@'

server:
  port: 8080

logging:
  level:
    root: INFO
    com.zaxxer.hikari: INFO
    # Turn these up temporarily when debugging queries:
    #   org.hibernate.SQL: DEBUG
    #   org.hibernate.orm.jdbc.bind: TRACE   (logs bound parameters)
    org.hibernate.SQL: WARN
    org.hibernate.type: WARN
